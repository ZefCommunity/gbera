<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — Gbera</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="stylesheet" href="../css/auth.css">
</head>
<body>
  <div id="gbera-navbar"></div>

  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="auth-brand__logo" aria-hidden="true">G</div>
        <h1 class="auth-title">Reset password</h1>
        <p class="auth-subtitle">Enter your email to receive a reset link</p>
      </div>

      <div id="fp-alert" class="auth-alert" role="alert" hidden></div>

      <form id="forgot-form" class="auth-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="fp-email">Email</label>
          <input class="form-input" id="fp-email" name="email" type="email" inputmode="email" autocomplete="email" required aria-required="true" aria-describedby="fp-email-error">
          <span class="auth-error" id="fp-email-error" role="alert" aria-live="polite"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="fp-submit">Send reset link</button>
      </form>

      <div class="auth-divider"><span>or</span></div>
      <div class="auth-links">
        <a href="auth.html">Back to login</a>
      </div>
    </div>
  </main>

  <div id="gbera-footer"></div>

  <script src="../js/utils.js"></script>
  <script src="../js/components.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/authService.js"></script>
  <script src="../js/authValidation.js"></script>
  <script src="../js/auth.js"></script>
</body>
</html>
